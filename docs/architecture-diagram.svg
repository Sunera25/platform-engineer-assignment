<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Arial, sans-serif" font-size="12">
  <!-- Background -->
  <rect width="900" height="620" fill="#f8f9fa" rx="8"/>
  <text x="450" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a2e">TaskFlow — AWS Architecture</text>

  <!-- Internet -->
  <rect x="30" y="50" width="100" height="50" rx="8" fill="#4a90d9" stroke="#2c5f8a" stroke-width="1.5"/>
  <text x="80" y="70" text-anchor="middle" fill="white" font-weight="bold">Internet</text>
  <text x="80" y="88" text-anchor="middle" fill="white" font-size="10">User / Client</text>

  <!-- Arrow: Internet → ALB -->
  <line x1="130" y1="75" x2="190" y2="75" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="160" y="68" text-anchor="middle" fill="#555" font-size="10">HTTP :80</text>

  <!-- AWS Region box -->
  <rect x="175" y="42" width="700" height="560" rx="10" fill="none" stroke="#ff9900" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="195" y="60" fill="#ff9900" font-size="11" font-weight="bold">AWS Region: us-east-1</text>

  <!-- VPC box -->
  <rect x="190" y="68" width="670" height="520" rx="8" fill="none" stroke="#146eb4" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="208" y="84" fill="#146eb4" font-size="11">VPC (10.0.0.0/16)</text>

  <!-- Public Subnets box -->
  <rect x="205" y="92" width="300" height="130" rx="6" fill="#e8f4fd" stroke="#5dade2" stroke-width="1"/>
  <text x="355" y="108" text-anchor="middle" fill="#5dade2" font-size="10" font-weight="bold">Public Subnets (us-east-1a, us-east-1b)</text>

  <!-- ALB -->
  <rect x="230" y="115" width="120" height="50" rx="6" fill="#2ecc71" stroke="#1a8a4a" stroke-width="1.5"/>
  <text x="290" y="136" text-anchor="middle" fill="white" font-weight="bold">ALB</text>
  <text x="290" y="153" text-anchor="middle" fill="white" font-size="10">Application Load</text>
  <text x="290" y="163" text-anchor="middle" fill="white" font-size="10">Balancer</text>

  <!-- NAT Gateway -->
  <rect x="380" y="115" width="110" height="50" rx="6" fill="#9b59b6" stroke="#6c3483" stroke-width="1.5"/>
  <text x="435" y="136" text-anchor="middle" fill="white" font-weight="bold">NAT</text>
  <text x="435" y="153" text-anchor="middle" fill="white" font-size="10">Gateway</text>

  <!-- Arrow: Internet to ALB -->
  <line x1="190" y1="140" x2="230" y2="140" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Private Subnets box -->
  <rect x="205" y="240" width="650" height="330" rx="6" fill="#fef9e7" stroke="#f0b429" stroke-width="1"/>
  <text x="530" y="256" text-anchor="middle" fill="#e67e22" font-size="10" font-weight="bold">Private Subnets (us-east-1a, us-east-1b)</text>

  <!-- ECS Cluster box -->
  <rect x="215" y="265" width="380" height="290" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
  <text x="405" y="281" text-anchor="middle" fill="#27ae60" font-size="11" font-weight="bold">ECS Cluster: prod-taskflow-cluster</text>

  <!-- EC2 Instance 1 -->
  <rect x="230" y="292" width="160" height="130" rx="5" fill="white" stroke="#85c1e9" stroke-width="1.5"/>
  <text x="310" y="307" text-anchor="middle" fill="#2980b9" font-size="10" font-weight="bold">EC2 (t3.micro)</text>
  <text x="310" y="320" text-anchor="middle" fill="#555" font-size="9">ECS-Optimized AMI</text>
  <!-- Container box 1 -->
  <rect x="242" y="328" width="136" height="55" rx="4" fill="#d5f5e3" stroke="#2ecc71" stroke-width="1"/>
  <text x="310" y="344" text-anchor="middle" fill="#1a5c31" font-size="9" font-weight="bold">Docker Container</text>
  <text x="310" y="357" text-anchor="middle" fill="#1a5c31" font-size="9">TaskFlow :8080</text>
  <text x="310" y="370" text-anchor="middle" fill="#1a5c31" font-size="9">Spring Boot 3.4</text>
  <text x="310" y="400" text-anchor="middle" fill="#555" font-size="9">AWS agents: ECS, CW</text>

  <!-- EC2 Instance 2 -->
  <rect x="410" y="292" width="160" height="130" rx="5" fill="white" stroke="#85c1e9" stroke-width="1.5"/>
  <text x="490" y="307" text-anchor="middle" fill="#2980b9" font-size="10" font-weight="bold">EC2 (t3.micro)</text>
  <text x="490" y="320" text-anchor="middle" fill="#555" font-size="9">ECS-Optimized AMI</text>
  <!-- Container box 2 -->
  <rect x="422" y="328" width="136" height="55" rx="4" fill="#d5f5e3" stroke="#2ecc71" stroke-width="1"/>
  <text x="490" y="344" text-anchor="middle" fill="#1a5c31" font-size="9" font-weight="bold">Docker Container</text>
  <text x="490" y="357" text-anchor="middle" fill="#1a5c31" font-size="9">TaskFlow :8080</text>
  <text x="490" y="370" text-anchor="middle" fill="#1a5c31" font-size="9">Spring Boot 3.4</text>
  <text x="490" y="400" text-anchor="middle" fill="#555" font-size="9">AWS agents: ECS, CW</text>

  <!-- ASG label -->
  <text x="405" y="450" text-anchor="middle" fill="#7d6608" font-size="9" font-style="italic">Auto Scaling Group (desired=1, min=1, max=4)</text>

  <!-- RDS -->
  <rect x="620" y="270" width="160" height="100" rx="6" fill="#fadbd8" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="700" y="288" text-anchor="middle" fill="#922b21" font-weight="bold">RDS PostgreSQL</text>
  <text x="700" y="303" text-anchor="middle" fill="#922b21" font-size="10">db.t3.micro</text>
  <text x="700" y="318" text-anchor="middle" fill="#922b21" font-size="10">prod-taskflow</text>
  <text x="700" y="333" text-anchor="middle" fill="#922b21" font-size="10">Private subnet only</text>
  <text x="700" y="350" text-anchor="middle" fill="#922b21" font-size="10">Port 5432</text>

  <!-- Secrets Manager -->
  <rect x="620" y="385" width="160" height="70" rx="6" fill="#f9ebea" stroke="#cb4335" stroke-width="1.5"/>
  <text x="700" y="402" text-anchor="middle" fill="#78281f" font-weight="bold">Secrets Manager</text>
  <text x="700" y="418" text-anchor="middle" fill="#78281f" font-size="10">DB credentials</text>
  <text x="700" y="432" text-anchor="middle" fill="#78281f" font-size="10">injected at runtime</text>

  <!-- CloudWatch -->
  <rect x="620" y="470" width="160" height="80" rx="6" fill="#fef5e7" stroke="#f39c12" stroke-width="1.5"/>
  <text x="700" y="488" text-anchor="middle" fill="#784212" font-weight="bold">CloudWatch</text>
  <text x="700" y="503" text-anchor="middle" fill="#784212" font-size="10">Log group: /ecs/prod-taskflow</text>
  <text x="700" y="518" text-anchor="middle" fill="#784212" font-size="10">CPU/Memory alarms</text>
  <text x="700" y="533" text-anchor="middle" fill="#784212" font-size="10">→ Lambda scaler</text>

  <!-- ECR (outside VPC, top right) -->
  <rect x="720" y="70" width="130" height="60" rx="6" fill="#d2b4de" stroke="#7d3c98" stroke-width="1.5"/>
  <text x="785" y="92" text-anchor="middle" fill="#4a235a" font-weight="bold">Amazon ECR</text>
  <text x="785" y="108" text-anchor="middle" fill="#4a235a" font-size="10">prod-taskflow</text>
  <text x="785" y="120" text-anchor="middle" fill="#4a235a" font-size="10">:{git-sha} tags</text>

  <!-- Lambda (outside VPC) -->
  <rect x="720" y="145" width="130" height="60" rx="6" fill="#f8c471" stroke="#d68910" stroke-width="1.5"/>
  <text x="785" y="167" text-anchor="middle" fill="#784212" font-weight="bold">Lambda</text>
  <text x="785" y="183" text-anchor="middle" fill="#784212" font-size="10">vertical-scaler</text>

  <!-- Arrows -->
  <!-- ALB → EC2 instance 1 -->
  <line x1="290" y1="165" x2="290" y2="242" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="305" y="205" fill="#27ae60" font-size="9">Target Group</text>

  <!-- ALB → EC2 instance 2 -->
  <path d="M 350 165 Q 490 220 490 265" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>

  <!-- EC2 → RDS -->
  <line x1="595" y1="355" x2="620" y2="330" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="598" y="348" fill="#e74c3c" font-size="9">JDBC</text>

  <!-- Containers → CloudWatch Logs -->
  <line x1="490" y1="425" x2="620" y2="495" stroke="#f39c12" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrowO)"/>
  <text x="540" y="468" fill="#f39c12" font-size="9">awslogs</text>

  <!-- CloudWatch → Lambda -->
  <line x1="785" y1="205" x2="785" y2="150" stroke="#d68910" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="800" y="183" fill="#d68910" font-size="9">Alarm</text>

  <!-- Lambda → ECS (update task def) -->
  <path d="M 720 175 Q 490 200 490 265" fill="none" stroke="#d68910" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <text x="580" y="210" fill="#d68910" font-size="9">register+deploy</text>

  <!-- NAT → Internet -->
  <line x1="435" y1="115" x2="435" y2="75" stroke="#9b59b6" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrowP)"/>
  <line x1="435" y1="75" x2="130" y2="75" stroke="#9b59b6" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="280" y="62" text-anchor="middle" fill="#9b59b6" font-size="9">Outbound (ECR pull, CW, Secrets)</text>

  <!-- ECR → ECS task (pull) -->
  <line x1="720" y1="100" x2="600" y2="370" stroke="#7d3c98" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrowP)"/>

  <!-- Secrets → Task (inject) -->
  <line x1="620" y1="420" x2="596" y2="375" stroke="#cb4335" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrowR)"/>
  <text x="590" y="410" fill="#cb4335" font-size="9" text-anchor="end">env inject</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
    <marker id="arrowO" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f39c12"/>
    </marker>
    <marker id="arrowP" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#9b59b6"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#cb4335"/>
    </marker>
  </defs>

  <!-- Legend -->
  <rect x="210" y="465" width="380" height="100" rx="4" fill="white" stroke="#ddd" stroke-width="1"/>
  <text x="400" y="480" text-anchor="middle" fill="#555" font-size="10" font-weight="bold">Request Flow</text>
  <text x="220" y="498" fill="#555" font-size="9">1. User HTTP → ALB (public subnet)</text>
  <text x="220" y="512" fill="#555" font-size="9">2. ALB → ECS task container (port 8080, bridge mode)</text>
  <text x="220" y="526" fill="#555" font-size="9">3. Container → RDS PostgreSQL (JDBC, private subnet)</text>
  <text x="220" y="540" fill="#555" font-size="9">4. Container logs → CloudWatch via awslogs driver</text>
  <text x="220" y="554" fill="#555" font-size="9">5. CloudWatch alarm → Lambda → update ECS task def (vertical scaling)</text>
</svg>
